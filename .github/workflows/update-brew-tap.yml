name: Update the homebrew tap
on:
  release:
    types: [published, released]
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy]
    types:
      - completed
jobs:
  run-script:
    runs-on: ubuntu-latest
    # Only run when triggered manually, by a release, or by a successful Deploy
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: Hugo-Persson/homebrew-dns-cli-tools
          # Deploy key (write access) on homebrew-dns-cli-tools; does not expire like a PAT.
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          ref: main
      - name: List files
        run: ls -la
      - name: Run Release Script
        run: |
          chmod +x scripts/new-release-dns-cli.sh
          ./scripts/new-release-dns-cli.sh
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Automated script run"
          git push
